<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 200" width="500" height="200">
  <defs>
    <!-- Gradient for the pencil body -->
    <linearGradient id="pencilGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FF6B35;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFB347;stop-opacity:1" />
    </linearGradient>
    <!-- Gradient for the circle background -->
    <linearGradient id="circleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2C3E50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1A252F;stop-opacity:1" />
    </linearGradient>
    <!-- Shadow filter -->
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#000" flood-opacity="0.25"/>
    </filter>
    <!-- Glow filter -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background subtle rectangle -->
  <rect width="500" height="200" rx="12" fill="#FDF6EC"/>

  <!-- Decorative dots -->
  <circle cx="30" cy="30" r="2.5" fill="#FFB347" opacity="0.4"/>
  <circle cx="470" cy="170" r="2.5" fill="#FFB347" opacity="0.4"/>
  <circle cx="450" cy="35" r="1.8" fill="#FF6B35" opacity="0.3"/>
  <circle cx="50" cy="165" r="1.8" fill="#FF6B35" opacity="0.3"/>

  <!-- Logo Icon Group -->
  <g transform="translate(65, 100)" filter="url(#shadow)">

    <!-- Outer circle -->
    <circle cx="0" cy="0" r="48" fill="url(#circleGrad)" />

    <!-- Decorative ring -->
    <circle cx="0" cy="0" r="44" fill="none" stroke="#FFB347" stroke-width="1.5" opacity="0.6"/>

    <!-- Pencil body (diagonal) -->
    <g transform="rotate(-45)">
      <!-- Pencil main body -->
      <rect x="-6" y="-22" width="12" height="38" rx="2" fill="url(#pencilGrad)"/>

      <!-- Pencil tip -->
      <polygon points="-6,-22 6,-22 0,-34" fill="#F4D03F"/>
      <polygon points="-4,-22 4,-22 0,-31" fill="#2C3E50"/>

      <!-- Pencil eraser -->
      <rect x="-6" y="16" width="12" height="6" rx="1.5" fill="#FF6B6B"/>

      <!-- Pencil stripe -->
      <line x1="-6" y1="10" x2="6" y2="10" stroke="#E8A817" stroke-width="1.5" opacity="0.7"/>
    </g>

    <!-- Small sparkle/star -->
    <g transform="translate(20, -28)" filter="url(#glow)">
      <polygon points="0,-6 1.5,-1.5 6,0 1.5,1.5 0,6 -1.5,1.5 -6,0 -1.5,-1.5" fill="#FFB347" opacity="0.9"/>
    </g>

    <!-- Another tiny sparkle -->
    <g transform="translate(-25, 25)">
      <polygon points="0,-3 0.8,-0.8 3,0 0.8,0.8 0,3 -0.8,0.8 -3,0 -0.8,-0.8" fill="#FFD700" opacity="0.7"/>
    </g>
  </g>

  <!-- Brand Name -->
  <g transform="translate(140, 82)">
    <!-- "First Point" text -->
    <text font-family="'Georgia', 'Times New Roman', serif" font-size="36" font-weight="bold" fill="#2C3E50" letter-spacing="2">
      First<tspan fill="#FF6B35"> Point</tspan>
    </text>
  </g>

  <!-- Tagline -->
  <g transform="translate(142, 112)">
    <text font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#7F8C8D" letter-spacing="5" font-weight="300">
      STATIONERY
    </text>
  </g>

  <!-- Decorative line -->
  <line x1="140" y1="122" x2="350" y2="122" stroke="#FFB347" stroke-width="1.2" opacity="0.5"/>

  <!-- Small tagline text -->
  <g transform="translate(142, 140)">
    <text font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10" fill="#95A5A6" letter-spacing="3" font-weight="300">
      YOUR FIRST CHOICE
    </text>
  </g>

</svg>
