<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-labelledby="logoTitle logoDesc">
  <title id="logoTitle">First Point Stationery &amp; General Supplies</title>
  <desc id="logoDesc">Logo featuring a stylized pen and ruler forming a point, with the brand name below.</desc>

  <defs>
    <!-- Navy gradient -->
    <linearGradient id="navyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14213d"/>
      <stop offset="100%" stop-color="#22335c"/>
    </linearGradient>

    <!-- Gold gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fca311"/>
      <stop offset="100%" stop-color="#ffc85c"/>
    </linearGradient>

    <!-- Light background gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f7f8fb"/>
    </radialGradient>

    <!-- Drop shadow -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#14213d" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- === BACKGROUND === -->
  <rect width="400" height="400" rx="48" fill="url(#bgGrad)"/>

  <!-- Subtle dotted grid pattern -->
  <g opacity="0.06" fill="#14213d">
    <circle cx="40" cy="40" r="2"/><circle cx="80" cy="40" r="2"/>
    <circle cx="120" cy="40" r="2"/><circle cx="160" cy="40" r="2"/>
    <circle cx="200" cy="40" r="2"/><circle cx="240" cy="40" r="2"/>
    <circle cx="280" cy="40" r="2"/><circle cx="320" cy="40" r="2"/>
    <circle cx="360" cy="40" r="2"/>
    <circle cx="40" cy="80" r="2"/><circle cx="360" cy="80" r="2"/>
    <circle cx="40" cy="320" r="2"/><circle cx="360" cy="320" r="2"/>
    <circle cx="40" cy="360" r="2"/><circle cx="80" cy="360" r="2"/>
    <circle cx="120" cy="360" r="2"/><circle cx="160" cy="360" r="2"/>
    <circle cx="200" cy="360" r="2"/><circle cx="240" cy="360" r="2"/>
    <circle cx="280" cy="360" r="2"/><circle cx="320" cy="360" r="2"/>
    <circle cx="360" cy="360" r="2"/>
  </g>

  <!-- === ICON AREA (Pen + Ruler forming a point) === -->
  <g transform="translate(200 150)" filter="url(#softShadow)">

    <!-- Gold circular badge backdrop -->
    <circle cx="0" cy="0" r="78" fill="url(#goldGrad)" opacity="0.15"/>
    <circle cx="0" cy="0" r="78" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-dasharray="4 6" opacity="0.5"/>

    <!-- Ruler (angled) -->
    <g transform="rotate(-38)">
      <rect x="-14" y="-72" width="28" height="144" rx="5" fill="url(#navyGrad)"/>
      <!-- Ruler tick marks -->
      <g stroke="#fca311" stroke-width="2.2" stroke-linecap="round">
        <line x1="-14" y1="-52" x2="-4" y2="-52"/>
        <line x1="-14" y1="-36" x2="-8" y2="-36"/>
        <line x1="-14" y1="-20" x2="-4" y2="-20"/>
        <line x1="-14" y1="-4"  x2="-8" y2="-4"/>
        <line x1="-14" y1="12"  x2="-4" y2="12"/>
        <line x1="-14" y1="28"  x2="-8" y2="28"/>
        <line x1="-14" y1="44"  x2="-4" y2="44"/>
        <line x1="-14" y1="60"  x2="-8" y2="60"/>
      </g>
    </g>

    <!-- Pen (angled opposite direction) -->
    <g transform="rotate(42)">
      <!-- Pen body -->
      <rect x="-9" y="-70" width="18" height="110" rx="4" fill="url(#navyGrad)"/>
      <!-- Pen cap -->
      <rect x="-10" y="-78" width="20" height="16" rx="4" fill="#fca311"/>
      <!-- Pen tip -->
      <path d="M -9 40 L 0 78 L 9 40 Z" fill="#fca311"/>
      <!-- Pen tip ink -->
      <path d="M -3 66 L 0 78 L 3 66 Z" fill="#14213d"/>
      <!-- Pen clip -->
      <rect x="9" y="-72" width="3" height="26" rx="1.5" fill="#fca311"/>
      <!-- Pen highlight -->
      <rect x="-6" y="-58" width="3" height="60" rx="1.5" fill="#ffffff" opacity="0.18"/>
    </g>

    <!-- Center accent dot (the "point") -->
    <circle cx="0" cy="0" r="10" fill="url(#goldGrad)"/>
    <circle cx="0" cy="0" r="4" fill="#14213d"/>
  </g>

  <!-- === BRAND TEXT === -->
  <g text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">

    <!-- Main brand name -->
    <text x="200" y="270"
          font-size="30"
          font-weight="800"
          fill="#14213d"
          letter-spacing="-0.5">
      First Point
    </text>

    <!-- Sub-brand -->
    <text x="200" y="298"
          font-size="15"
          font-weight="700"
          fill="#e08e00"
          letter-spacing="4">
      STATIONERY
    </text>

    <!-- Divider line -->
    <g stroke="#fca311" stroke-width="2" stroke-linecap="round">
      <line x1="140" y1="315" x2="175" y2="315"/>
      <circle cx="200" cy="315" r="2.5" fill="#fca311" stroke="none"/>
      <line x1="225" y1="315" x2="260" y2="315"/>
    </g>

    <!-- Tagline -->
    <text x="200" y="338"
          font-size="11"
          font-weight="600"
          fill="#5d6b85"
          letter-spacing="2.5">
      &amp; GENERAL SUPPLIES
    </text>

    <!-- Location -->
    <text x="200" y="358"
          font-size="10"
          font-weight="500"
          fill="#8894ab"
          letter-spacing="1.5">
      LIMBE · BLANTYRE · MALAWI
    </text>
  </g>
</svg>
